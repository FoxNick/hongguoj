name: Build app packages

on:
  push:
    branches: [main]
    tags: ['app-v*']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: 校验 tag 与 pubspec 版本一致
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#app-v}"
          tag_version="${tag_version//-/+}"
          pub_version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ "$tag_version" != "$pub_version" ]; then
            echo "标签版本 ${tag_version} 与 pubspec ${pub_version} 不一致。" >&2
            exit 1
          fi
      - name: 编译原生核心
        working-directory: native
        run: go build ./...
      - name: 静态检查原生核心
        working-directory: native
        run: go vet ./...
      - name: 原生核心单元测试
        working-directory: native
        continue-on-error: true
        run: go test ./...
      - name: 获取 Dart 依赖
        run: flutter pub get
      - name: 分析 Dart 与测试
        run: flutter analyze --no-fatal-infos lib test

  android:
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py --all-sources
      - name: 校验 APK 签名证书
        shell: bash
        run: |
          set -euo pipefail
          expected='d04a0d1a33a8454a2dae629c4703aa46f42034f25352d350d08ffb5df9f6e2c2'
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n1)
          test -n "$apksigner"
          for apk in dist/android/*.apk; do
            output=$("$apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -Fxq 'Number of signers: 1'
            actual=$(printf '%s\n' "$output" | sed -En 's/^(Signer #[0-9]+|V[0-9]+([.][0-9]+)? Signer):? certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
            test "$actual" = "$expected"
          done
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [android]
    if: success() && (startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成发布文件清单
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          mkdir -p release
          for directory in artifacts/*/; do
            for file in "$directory"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              if [ "$name" = "SHA256SUMS.txt" ]; then
                continue
              fi
              cp "$file" "release/$name"
            done
          done
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="app-v${version//+/-}"
          fi
          release=${version%%+*}
          section=$(awk -v v="## ${release} " 'index($0, v) == 1 { found = 1; next } found && /^## / { exit } found { print }' README.md)
          {
            printf '%s\n\n' "版本 ${version}。本版为真果鉴全站源 Android APK。"
            if [[ -n "${section//[[:space:]]/}" ]]; then
              printf '%s\n' "$section"
            else
              printf '%s\n' "- 全站源：包含全部已接入站源"
            fi
            printf '\n%s\n' "Android（固定正式证书签名；与既有版本是否可覆盖取决于签名一致性，未做真实手机 / TV 验收）："
            printf '%s\n' "- *-arm64-v8a.apk：绝大多数手机选这个"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"
          } > notes.md
          if [[ "$version" == *-* ]]; then
            echo "开发快照不能作为最终正式版发布。" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "版本已存在；请递增版本后发布，禁止覆盖既有发布文件。" >&2
            exit 1
          fi
          gh release create "$tag" release/* --target "${{ github.sha }}" --title "短句汇 ${version}" --notes-file notes.md
