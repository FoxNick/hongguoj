name: Build app packages

on:
  push:
    branches: [main]
    tags: ['app-v*']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: 缓存 Go 编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('native/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: 缓存 pub 依赖
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: 校验 tag 与 pubspec 版本一致
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#app-v}"
          tag_version="${tag_version//-/+}"
          pub_version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          if [ "$tag_version" != "$pub_version" ]; then
            echo "标签版本 ${tag_version} 与 pubspec ${pub_version} 不一致。" >&2
            exit 1
          fi
      - name: 编译原生核心
        working-directory: native
        run: go build ./...
      - name: 静态检查原生核心
        working-directory: native
        run: go vet ./...
      - name: 原生核心单元测试
        working-directory: native
        continue-on-error: true
        run: go test ./...
      - name: 获取 Dart 依赖
        run: flutter pub get
      - name: 分析 Dart
        run: flutter analyze --no-fatal-infos lib test
      - name: Dart 回归测试
        run: bash scripts/run_dart_tests.sh
      - name: 全量 Dart 测试（仅报告）
        continue-on-error: true
        run: flutter test --reporter expanded

  android:
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: 缓存 pub 依赖
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py --all-sources
      - name: 校验 APK 签名证书
        shell: bash
        run: |
          set -euo pipefail
          expected='d04a0d1a33a8454a2dae629c4703aa46f42034f25352d350d08ffb5df9f6e2c2'
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n1)
          test -n "$apksigner"
          for apk in dist/android/*.apk; do
            output=$("$apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -Fxq 'Number of signers: 1'
            actual=$(printf '%s\n' "$output" | sed -En 's/^(Signer #[0-9]+|V[0-9]+([.][0-9]+)? Signer):? certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
            test "$actual" = "$expected"
          done
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: duanjuhui-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: [verify]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/app-v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: 缓存 Go 编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('native/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: 缓存 pub 依赖
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress
      - name: 构建 Windows 应用
        run: python scripts/build_windows.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: duanjuhui-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  publish-android:
    needs: [android]
    if: success() && (startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: app-publish-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duanjuhui-android
          path: assets
      - name: 创建或追加 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > platform-notes.md <<'NOTES'
          Android（固定正式证书签名；与既有版本是否可覆盖取决于签名一致性，未做真实手机 / TV 验收）：
          - *-arm64-v8a.apk：绝大多数手机选这个
          - *-armeabi-v7a.apk：较老的 32 位手机
          - *-x86_64.apk：模拟器
          NOTES
          bash scripts/publish_release.sh assets platform-notes.md

  publish-windows:
    needs: [windows]
    if: success() && (startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: app-publish-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duanjuhui-windows
          path: assets
      - name: 创建或追加 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > platform-notes.md <<'NOTES'
          Windows（未做真机验收）：
          - *-windows-x64.zip：免安装，解压后直接运行
          - *-windows-x64.exe：安装程序，装到 Program Files 并建立快捷方式
          - 安装前请先从托盘退出：安装程序检测到正在运行的短句汇会提示，右键托盘图标选「退出」即可
          NOTES
          bash scripts/publish_release.sh assets platform-notes.md
